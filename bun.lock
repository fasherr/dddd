      background: #f8fafc;
      color: #0f172a;
      line-height: 1.6;
      padding: 24px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #0f172a;
    }
    .meta {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .search-box {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      outline: none;
    }
    .search-box:focus { border-color: #6366f1; ring: 2px solid #e0e7ff; }
    .cue-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .cue-item {
      display: flex;
      gap: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cue-item:hover { background: #eef2ff; border-color: #c7d2fe; }
    .cue-time {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      color: #6366f1;
      white-space: nowrap;
      padding-top: 2px;
    }
    .cue-text { font-size: 14px; color: #1e293b; flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>${title}</h1>
    <div class="meta">Всего реплик: ${cues.length} | 100% автономный интерактивный документ</div>
    <input type="text" id="search" class="search-box" placeholder="Поиск по тексту расшифровки...">
    <ul class="cue-list" id="list"></ul>
  </div>

  <script>
    const data = ${itemsJson};
    const list = document.getElementById('list');
    const search = document.getElementById('search');

    function render(items) {
      list.innerHTML = '';
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'cue-item';
        li.innerHTML = '<span class="cue-time">' + item.time + '</span><span class="cue-text">' + item.text.replace(/\\n/g, '<br>') + '</span>';
        li.onclick = () => {
          navigator.clipboard.writeText(item.text);
          li.style.background = '#dcfce7';
          setTimeout(() => li.style.background = '', 600);
        };
        list.appendChild(li);
      });
    }

    render(data);

    search.oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = data.filter(d => d.text.toLowerCase().includes(q));
      render(filtered);
    };
  </script>
</body>
</html>`;
}
